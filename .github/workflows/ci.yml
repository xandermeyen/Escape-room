name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  kwaliteit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm installeren
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Node.js instellen
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencies installeren
        run: pnpm install --frozen-lockfile

      - name: Linten
        run: pnpm lint

      - name: Types controleren
        run: pnpm typecheck

      - name: Tests draaien
        run: pnpm test

      - name: Opmaak controleren (Prettier)
        run: pnpm format:check

      - name: HTML valideren
        run: pnpm lint:html

      - name: Bouwen
        run: pnpm build

  rules:
    name: Firebase rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm installeren
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Node.js instellen
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Java instellen (nodig voor de Database-emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencies installeren
        run: pnpm install --frozen-lockfile

      - name: Rules testen tegen de emulator
        run: pnpm test:rules

  e2e:
    name: End-to-end (Playwright, twee spelers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm installeren
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Node.js instellen
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencies installeren
        run: pnpm install --frozen-lockfile

      - name: Chromium voor Playwright installeren
        run: pnpm exec playwright install --with-deps chromium

      - name: Volledige run van Kamer 14
        run: pnpm test:e2e

      - name: Sporen bewaren bij een mislukte test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-sporen
          path: test-results/
          retention-days: 7
